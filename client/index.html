<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serfdom</title>
    <!-- Empty icon: stops the browser's automatic /favicon.ico request (404)
         until a real icon is made. -->
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="game-container">
      <aside id="hud">
        <h1>Serfdom</h1>
        <p>
          HUD placeholder — debug readout. Move: W A S D. Rotate: Q / E (Z
          resets). Fire mode: T. Manual fire: left click. Exit dungeon: R.
        </p>
        <h2>Serf</h2>
        <dl id="hud-serf" class="debug-list"></dl>
        <h2>Live</h2>
        <dl id="hud-live" class="debug-list"></dl>
        <h2>Layout</h2>
        <dl id="hud-layout" class="debug-list"></dl>
      </aside>
      <main id="gameplay"></main>
      <!-- Menu, queue, death and completion screens (screens.ts). -->
      <section id="screen" class="screen"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
